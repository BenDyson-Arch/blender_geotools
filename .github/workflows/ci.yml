name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  # Tool pins: ruff's default rule set changes between releases.
  RUFF_VERSION: "0.17.4"
  PYTEST_VERSION: "9.2.0"
  NUMPY_VERSION: "2.5.4"
  # Property tests (tests/core/test_properties.py); a new release may draw other examples.
  HYPOTHESIS_VERSION: "6.170.14"
  # import-linter checks the layering in [tool.importlinter] (pyproject.toml); uvx runs it.
  IMPORT_LINTER_VERSION: "2.15"
  # pyright type-checks the packages in [tool.pyright] (pyproject.toml); uvx runs it.
  PYRIGHT_VERSION: "1.1.414"
  UV_VERSION: "0.13.6"
  # Official Blender 5.2 LTS, latest patch release. To update, take the
  # linux-x64 .tar.xz, macos-arm64 .dmg and windows-x64 .zip lines from
  #   https://download.blender.org/release/Blender5.2/blender-<version>.sha256
  BLENDER_VERSION: "5.2.4"
  BLENDER_SHA256: "2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86"
  BLENDER_SHA256_MACOS_ARM64: "e73d564f97061b2496ccc5a0bd738937d2d3d0acae23621a00bbc7534dfd135f"
  BLENDER_SHA256_WINDOWS_X64: "bbd78f8931dc940444da4ff2983374930f9f5c092ae0e330588e9760bb9d967c"
  # External validators, run on GeoTools output in the blender-wheel job (tests/extvalidate.py).
  # 3d-tiles-validator and its whole tree are pinned with integrity hashes in
  # tests/validators/package-lock.json (resolved with npm --before, two weeks back).
  # glTF-Validator is Khronos' release binary; its SHA-256 was computed at pinning,
  # as the release publishes none.
  NODE_VERSION: "22.23.4"
  GLTF_VALIDATOR_VERSION: "2.0.0-dev.3.10"
  GLTF_VALIDATOR_SHA256: "168eba887964125abe17ae97899b38d0b3cfd73c266c78424c194929ddcbc522"

jobs:
  core:
    name: core (pytest, ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tools
        # pyproj at the pin bundled in the extension ([tool.geotools.wheels]), so the
        # reprojection tests run instead of skipping.
        run: |
          pyproj_pin=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["geotools"]["wheels"]["pyproj"])')
          python -m pip install "pytest==${PYTEST_VERSION}" "ruff==${RUFF_VERSION}" \
            "numpy==${NUMPY_VERSION}" "pyproj==${pyproj_pin}" "uv==${UV_VERSION}" \
            "hypothesis==${HYPOTHESIS_VERSION}"
      - name: ruff check
        run: ruff check --output-format=github geotools scripts tests
      - name: ruff format --check
        run: ruff format --check geotools scripts tests
      - name: import-linter (layering)
        run: uvx --from "import-linter==${IMPORT_LINTER_VERSION}" lint-imports
      - name: pyright (types)
        run: uvx "pyright@${PYRIGHT_VERSION}" --pythonpath "$(command -v python)"
      - name: pytest (tests/core)
        run: python -m pytest

  # macOS and Windows. Not required checks yet: they run on every pull request
  # but do not gate merges (see CONTRIBUTING.md, CI).
  core-os:
    name: core (pytest, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64
          - os: windows-latest
            label: Windows x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tools
        run: |
          pyproj_pin=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["geotools"]["wheels"]["pyproj"])')
          python -m pip install "pytest==${PYTEST_VERSION}" \
            "numpy==${NUMPY_VERSION}" "pyproj==${pyproj_pin}" "hypothesis==${HYPOTHESIS_VERSION}"
      - name: pytest (tests/core)
        run: python -m pytest

  blender:
    name: blender (official 5.2 LTS, no wheels)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Blender
        id: blender
        uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.BLENDER_VERSION }}
          sha256: ${{ env.BLENDER_SHA256 }}
      - name: Validate and build the extension (no wheels)
        run: python scripts/build_extension.py --blender "$BLENDER" --no-wheels --out dist
      - name: Upload the extension zip
        uses: actions/upload-artifact@v7
        with:
          name: geotools-extension-no-wheels
          path: dist/*.zip
          if-no-files-found: error
      - name: Install and test in Blender (rusty-tiles missing)
        run: |
          shopt -s failglob
          python scripts/run_blender_tests.py --blender "$BLENDER" --zip dist/geotools-*.zip \
            --expect missing

  blender-os:
    name: blender (${{ matrix.label }}, no wheels)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64
            platform: macos-arm64
            artifact: macos_arm64
          - os: windows-latest
            label: Windows x64
            platform: windows-x64
            artifact: windows_x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Blender
        id: blender
        uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.BLENDER_VERSION }}
          platform: ${{ matrix.platform }}
          sha256: ${{ matrix.platform == 'macos-arm64' && env.BLENDER_SHA256_MACOS_ARM64 || env.BLENDER_SHA256_WINDOWS_X64 }}
      - name: Validate and build the extension (no wheels)
        run: python scripts/build_extension.py --blender "$BLENDER" --no-wheels --out dist
      - name: Upload the extension zip
        uses: actions/upload-artifact@v7
        with:
          name: geotools-extension-no-wheels-${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Install and test in Blender (rusty-tiles missing)
        run: |
          shopt -s failglob
          python scripts/run_blender_tests.py --blender "$BLENDER" --zip dist/geotools-*.zip \
            --expect missing

  blender-wheel:
    name: blender (official 5.2 LTS, rusty-tiles wheel from PyPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Tests the pinned PyPI wheels ([tool.geotools.wheels] in pyproject.toml:
    # rusty-tiles 0.4.1, pyproj, certifi) in Blender with --expect available, so the
    # publish, inspect and CRS tests run against the real wheel. It gates: a failure
    # fails the run, and it never falls back to a wheel-less build. The external
    # validators are required here: a missing one fails the tests instead of skipping.
    env:
      GEOTOOLS_TEST_REQUIRE_VALIDATORS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the external validators (3d-tiles-validator, glTF-Validator)
        # Installed outside the checkout, so node_modules never reaches the repository's checks.
        run: |
          validators="$RUNNER_TEMP/validators"
          mkdir -p "$validators/gltf"
          cp tests/validators/package.json tests/validators/package-lock.json "$validators/"
          npm ci --prefix "$validators" --no-audit --no-fund
          archive="$RUNNER_TEMP/gltf_validator.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/KhronosGroup/glTF-Validator/releases/download/${GLTF_VALIDATOR_VERSION}/gltf_validator-${GLTF_VALIDATOR_VERSION}-linux64.tar.xz"
          echo "${GLTF_VALIDATOR_SHA256}  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$validators/gltf" gltf_validator
          echo "GEOTOOLS_TEST_3D_TILES_VALIDATOR=$validators/node_modules/.bin/3d-tiles-validator" >> "$GITHUB_ENV"
          echo "GEOTOOLS_TEST_GLTF_VALIDATOR=$validators/gltf/gltf_validator" >> "$GITHUB_ENV"
          "$validators/node_modules/.bin/3d-tiles-validator" --version
      - name: pytest (external validators on the core GLB writer)
        run: |
          pyproj_pin=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["geotools"]["wheels"]["pyproj"])')
          python -m pip install "pytest==${PYTEST_VERSION}" "numpy==${NUMPY_VERSION}" "pyproj==${pyproj_pin}" \
            "hypothesis==${HYPOTHESIS_VERSION}"
          python -m pytest tests/core/test_extvalidate.py tests/core/test_metadata_glb.py
      - name: Set up Blender
        id: blender
        uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.BLENDER_VERSION }}
          sha256: ${{ env.BLENDER_SHA256 }}
      - name: Fetch the pinned wheels (rusty-tiles, pyproj, certifi; PyPI, linux-x64)
        run: python scripts/fetch_wheels.py --platform linux-x64
      - name: Validate and build the extension (linux-x64 wheel)
        run: python scripts/build_extension.py --blender "$BLENDER" --out dist
      - name: Upload the extension zip
        uses: actions/upload-artifact@v7
        with:
          name: geotools-extension-linux-x64
          path: dist/*.zip
          if-no-files-found: error
      - name: Install and test in Blender (rusty-tiles and pyproj available at the pins)
        # --expect-version and --expect-pyproj-version default to the pins in pyproject.toml.
        run: |
          shopt -s failglob
          python scripts/run_blender_tests.py --blender "$BLENDER" \
            --zip dist/geotools-*-linux_x64.zip --expect available

  # Both ends of the range users can install: the oldest Blender the manifest
  # allows (blender_version_min, which tests/core/test_ci_pins.py holds this
  # matrix to) and the newest official release. Each runs both suites, with
  # and without the wheels; the wheel run fails if Blender's CPython cannot
  # load the cp313 wheels. Not required checks yet (see CONTRIBUTING.md, CI).
  # Checksums: the linux-x64 .tar.xz line of
  #   https://download.blender.org/release/Blender<major.minor>/blender-<version>.sha256
  blender-range:
    name: blender (official ${{ matrix.blender.version }}, ${{ matrix.wheels && 'rusty-tiles wheel from PyPI' || 'no wheels' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        blender:
          - version: "5.2.0"
            sha256: "96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48"
          - version: "5.3.0"
            sha256: "dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05"
        wheels: [false, true]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Blender
        id: blender
        uses: ./.github/actions/setup-blender
        with:
          version: ${{ matrix.blender.version }}
          sha256: ${{ matrix.blender.sha256 }}
      - name: Fetch the pinned wheels (rusty-tiles, pyproj, certifi; PyPI, linux-x64)
        if: matrix.wheels
        run: python scripts/fetch_wheels.py --platform linux-x64
      - name: Validate and build the extension
        run: python scripts/build_extension.py --blender "$BLENDER" --out dist ${{ !matrix.wheels && '--no-wheels' || '' }}
      - name: Install and test in Blender
        # The runner logs Blender's CPython and checks the zip's wheels against it.
        env:
          EXPECT: ${{ matrix.wheels && 'available' || 'missing' }}
        run: |
          shopt -s failglob
          zips=(dist/geotools-*.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::expected one zip, got ${zips[*]}"; exit 1; }
          python scripts/run_blender_tests.py --blender "$BLENDER" --zip "${zips[0]}" \
            --expect "$EXPECT"

  ui-screenshots:
    name: UI screenshots (clipped text)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GUI Blender on Xvfb, on Mesa's software Vulkan (lavapipe; with its software
    # OpenGL, Blender's screenshots are black). Pull requests that touch the
    # sidebar's code get its screenshots as an artifact, and fail on text clipped
    # at the default sidebar width; at the narrow width it only warns
    # (scripts/ui_screenshots.py). Other pull requests skip the steps. Not a
    # required check.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Does the change touch the UI?
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] ||
             git diff --name-only HEAD^1 HEAD |
               grep -qE '^(geotools/blender/|scripts/ui_screenshots\.py$|\.github/workflows/ci\.yml$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "No sidebar changes; skipping the screenshots."
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.ui == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Blender
        if: steps.changes.outputs.ui == 'true'
        uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.BLENDER_VERSION }}
          sha256: ${{ env.BLENDER_SHA256 }}
      - name: Install Xvfb and Mesa's Vulkan driver
        if: steps.changes.outputs.ui == 'true'
        run: |
          sudo apt-get install -y -q --no-install-recommends \
            xvfb xauth mesa-vulkan-drivers libvulkan1
      - name: Fetch the pinned wheels (so the demo publishes and Last Build shows)
        if: steps.changes.outputs.ui == 'true'
        run: python scripts/fetch_wheels.py --platform linux-x64
      - name: Screenshot the sidebar and check for clipped text
        if: steps.changes.outputs.ui == 'true'
        run: |
          xvfb-run -a -s "-screen 0 1920x1440x24 -dpi 96" \
            python scripts/ui_screenshots.py --blender "$BLENDER" --out ui-screenshots \
            --gpu-backend vulkan
      - name: Upload the screenshots
        if: always() && steps.changes.outputs.ui == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: ui-screenshots/
          if-no-files-found: warn
