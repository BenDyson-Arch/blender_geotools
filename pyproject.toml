# Tooling configuration only. GeoTools is a Blender extension, not a Python
# distribution; the add-on lives in geotools/ and ships via
# scripts/build_extension.py.

[tool.geotools]
# Platforms the extension is built for (Blender platform names). Each platform
# zip carries one wheel of every pin below (a pure wheel serves them all).
# Blender 5.x has no Intel macOS build, so there is no macos-x64 zip.
platforms = ["linux-x64", "windows-x64", "macos-arm64"]

[tool.geotools.wheels]
# One exact version per bundled distribution; scripts/fetch_wheels.py fetches
# them and scripts/build_extension.py refuses wheels that do not match.
rusty-tiles = "0.4.1"
# Reprojection of imported vector points (M8). PROJ is inside the wheel; no GDAL.
# 3.8.0 has cp313 wheels for every platform above (macOS arm64:
# 14.0); see docs/design/m8-geo-formats.md for why 3.8.0 and not 3.7.2.
pyproj = "3.8.0"
# pyproj's only dependency (CA bundle for optional PROJ grid downloads).
certifi = "2026.10.23"

[tool.pytest.ini_options]
testpaths = ["tests/core"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# ruff's default rule set (pinned with RUFF_VERSION in CI) plus every rule of these families.
extend-select = [
    "B",  # likely bugs: raise-from, unused loop variables, zip() without strict=
    "SIM",  # simpler equivalents: contextlib.suppress, conditional expressions
    "PLW",  # pylint warnings: no global statements, no reassigned loop variables
    "RUF",  # ruff's own: escaped pytest.raises patterns, explicit and/or precedence
    "DTZ",  # naive datetimes: times are aware UTC (sun.utc_datetime) or sun.wall_clock
    "PTH",  # pathlib for file access; stored paths are text, see the ignores below
]
ignore = [
    # Tuple/list concatenation to unpacking. It cannot tell sequences from numpy arrays
    # and mathutils vectors, where `array + (dx, dy, dz)` is vector addition, not concatenation.
    "RUF005",
    # os.path.abspath() to Path.resolve(). resolve() follows symlinks; GeoTools resolves
    # only to compare (core/paths.py same_file, real) and keeps the path the user gave.
    "PTH100",
]
# Typography that UI strings and docstrings use on purpose (minus sign, en dash,
# multiplication sign, prime, Greek letters for angles and gamma).
allowed-confusables = ["−", "–", "×", "′", "α", "γ"]

[tool.ruff.lint.per-file-ignores]
# Blender reads bl_options and similar as plain mutable class attributes.
"geotools/blender/**" = ["RUF012"]
# wall_clock() makes the one naive datetime, the wall-clock input of to_utc().
"geotools/analysis/sun.py" = ["DTZ001"]
# Stored paths are text in the OS's spelling (or ntpath/posixpath under test), with
# Blender's // prefix; pathlib would re-spell them.
"geotools/core/paths.py" = ["PTH"]
"geotools/blender/blend_paths.py" = ["PTH"]
"tests/core/test_paths.py" = ["PTH"]
# The file browser's start folder needs a trailing separator, which Path cannot spell.
"geotools/blender/source.py" = ["PTH118"]
# splitext() splits image datablock names, which are not paths.
"geotools/blender/texture_state.py" = ["PTH122"]
# The MkDocs build hook is site tooling, outside the add-on and the checks here.
"docs/hooks/**" = ["PLW2901", "PTH"]
